name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/whalenpt/spida:v1.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Coverage)
        run: |
          conan install . -of build/RelWithDebInfo -s build_type=RelWithDebInfo
          cmake --preset conan-relwithdebinfo -DSPIDA_TEST=ON -DSPIDA_COVERAGE=ON

      - name: Build
        run: cmake --build --preset conan-relwithdebinfo --parallel

      - name: Run tests
        run: ctest --preset conan-relwithdebinfo --output-on-failure

      - name: Generate coverage report
        run: |
          set -euo pipefail
          lcov --capture \
               --directory build/RelWithDebInfo \
               --output-file coverage.info \
               --ignore-errors mismatch,inconsistent,inconsistent,gcov
          lcov --remove coverage.info \
               '/usr/*' \
               '*/external/*' \
               '/opt/conan/*' \
               '*/test/*' \
               '*/build/*' \
               --output-file coverage.filtered.info \
               --ignore-errors unused,inconsistent
          lcov --list coverage.filtered.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.filtered.info
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.filtered.info
          fail_ci_if_error: true
          verbose: true