name: CMake

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------
  # Linux (containerized — deps prebaked)
  # -------------------------
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/whalenpt/spida:v1.6
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: |
          conan install . -of build/Release -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: build/Release/Testing/
          retention-days: 7

  # -------------------------
  # Windows (native — Conan)
  # -------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Conan
        run: |
          py -m pip install --upgrade pip
          py -m pip install "conan>=2,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.conan2
          key: conan-windows-${{ hashFiles('conanfile.*', 'conan.lock') }}
          restore-keys: |
            conan-windows-

      - name: Configure (Release)
        run: |
          conan install . -of build/Release --build=missing -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker.exe --describe > $null

      - name: Package test (conan create + test_package)
        run: conan create . --build=missing -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: build/Release/Testing/
          retention-days: 7

  # -------------------------
  # macOS (native)
  # -------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ninja
          pip3 install --break-system-packages --upgrade 'conan>=2,<3'

      - name: Conan profile
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-${{ hashFiles('conanfile.*', 'conan.lock') }}
          restore-keys: |
            conan-macos-

      - name: Configure (Release)
        run: |
          conan install . -of build/Release --build=missing -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . --build=missing -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: build/Release/Testing/
          retention-days: 7
