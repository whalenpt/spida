name: CMake

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------
  # Linux (containerized — deps prebaked)
  # -------------------------
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/whalenpt/spida:v1.6
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: |
          conan install . -of build/Release -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        # --describe constructs no grid/model/solver -- it only proves the
        # binary that was just built actually links and runs on this
        # platform (catches a build-only-on-some-platforms class of bug the
        # rest of this job's build+test steps can't, since none of them
        # touch worker/ at all without -DSPIDA_WORKER=ON above).
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: build/Release/Testing/
          retention-days: 7

  # -------------------------
  # Windows (native — submodules, no Conan)
  # -------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (Release)
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build build/Release --parallel

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: Worker smoke test
        # Ninja is a single-config generator, so the executable lands
        # directly under build/Release/worker/ -- no per-configuration
        # subdirectory the way an MSVC-generator build would add. GitHub's
        # Windows runners default `run:` steps to PowerShell, not cmd.exe --
        # $null, not NUL, is the redirect target that's actually correct
        # there.
        run: build/Release/worker/spida-worker.exe --describe > $null

  # -------------------------
  # macOS (native)
  # -------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ninja
          pip3 install --break-system-packages --upgrade 'conan>=2,<3'

      - name: Conan profile
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-${{ hashFiles('conanfile.*', 'conan.lock') }}
          restore-keys: |
            conan-macos-

      - name: Configure (Release)
        run: |
          conan install . -of build/Release --build=missing -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        # --describe constructs no grid/model/solver -- it only proves the
        # binary that was just built actually links and runs on this
        # platform. This is the exact check that would have caught the
        # ETDAS.h std::vector<bool> build failure on macOS/libc++ as a red
        # CI run instead of a manually-pasted log.
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . --build=missing -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: build/Release/Testing/
          retention-days: 7