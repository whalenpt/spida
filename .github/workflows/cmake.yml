name: CMake

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------
  # Linux (containerized — deps prebaked)
  # -------------------------
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/whalenpt/spida:v1.6
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Release)
        run: |
          conan install . -of build/Release -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: build/Release/Testing/
          retention-days: 7

  # -------------------------
  # Windows (native — Conan)
  # -------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up Python
        # Needed so the conan console-script pip installs below actually
        # lands on PATH for later steps -- windows-latest's pre-installed
        # `py` launcher resolves to a Python whose Scripts dir isn't
        # guaranteed to be on PATH, which is what made `conan` unrecognized
        # in the next step even though `py -m pip install conan` itself
        # succeeded. setup-python prepends its own interpreter + Scripts
        # dir to PATH for the rest of this job, same effect the macOS job
        # gets for free from its already-on-PATH pip3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.conan2
          key: conan-windows-${{ hashFiles('conanfile.*', 'conan.lock') }}
          restore-keys: |
            conan-windows-

      - name: Configure (Release)
        # compiler.cppstd is pinned to 17 here because conan profile detect
        # --force's default for this MSVC toolchain is cppstd=14, which
        # made gtest/1.17.0 resolve as an Invalid binary (its own recipe
        # rejects cppstd<17) before the build ever started -- caught while
        # fixing the msys2/lockfile failure below, not yet hit by CI itself.
        # 17 matches what Linux's container image and macOS's `conan
        # profile detect --force` already resolve to (gnu17/appleclang
        # default) on the other two jobs.
        #
        # -c tools.cmake.cmaketoolchain:generator=Ninja: without this, Conan
        # falls back to its own default generator resolution for MSVC on
        # Windows, which is the multi-config "Visual Studio 18 2026"
        # generator -- and CMakeToolchain names its preset "conan-default"
        # for multi-config generators, not "conan-release" (that naming is
        # single-config-generator-only, e.g. Ninja/Makefiles), so the
        # `cmake --preset conan-release` below would fail to find it. Ninja
        # is already installed by the step above; this just tells Conan to
        # actually use it, matching the single-config preset naming the
        # rest of this job (and the Linux/macOS jobs) already assume.
        run: |
          conan install . -of build/Release --build=missing -s build_type=Release -s compiler.cppstd=17 -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker.exe --describe > $null

      - name: Package test (conan create + test_package)
        # Same cppstd=17 pin and Ninja generator override as the Configure
        # step above -- conan create resolves and builds its own graph
        # independently of the earlier steps.
        run: conan create . --build=missing -s build_type=Release -s compiler.cppstd=17 -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: build/Release/Testing/
          retention-days: 7

  # -------------------------
  # macOS (native)
  # -------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ninja
          pip3 install --break-system-packages --upgrade 'conan>=2,<3'

      - name: Conan profile
        run: conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-${{ hashFiles('conanfile.*', 'conan.lock') }}
          restore-keys: |
            conan-macos-

      - name: Configure (Release)
        run: |
          conan install . -of build/Release --build=missing -s build_type=Release
          cmake --preset conan-release -DSPIDA_TEST=ON -DSPIDA_WORKER=ON

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Worker smoke test
        run: build/Release/worker/spida-worker --describe > /dev/null

      - name: Package test (conan create + test_package)
        run: conan create . --build=missing -s build_type=Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: build/Release/Testing/
          retention-days: 7
