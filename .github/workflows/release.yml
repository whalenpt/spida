name: Release

# Publishes a self-contained source tarball as a GitHub Release asset for
# every vN.N.N tag. This exists because GitHub's own auto-generated tag
# tarball is a plain `git archive` — it does NOT include submodule content,
# so it's missing external/nayukidct, which spida's build needs. This
# tarball is what conanfile.py's source() fallback downloads for a consumer
# with no local git checkout of spida (see conanfile.py and CLAUDE.md).
#
# Also includes worker/, conanfile.py, and conan.lock — a second, broader
# audience than conanfile.py's own Conan-library-consumer one above: someone
# building spida-worker itself (see worker/README.md's "Building as an
# external consumer" section, e.g. spida-console's own Docker build)
# standalone, with no git checkout and no separate copy of conanfile.py
# already in hand. conanfile.py/conan.lock are harmless, unused extras in
# the source()-fallback flow above (Conan has already loaded and is
# executing the real recipe file by the time source() runs; a second copy
# landing in source_folder alongside the fetched sources is never re-read)
# but load-bearing for the standalone case, which runs `conan install .`
# directly against the extracted tarball and needs a conanfile.py right
# there to do it. This is why the tarball's staged file list below no
# longer matches conanfile.py's exports_sources exactly — see that file's
# own comment for why worker/ deliberately stays out of the Conan package
# proper.
#
# Gated on the CMake workflow (build+test+package-test on Linux/Windows/
# macOS) actually passing for this same tag. An earlier version of this
# workflow tried to get that via `on: workflow_run` listening for CMake's
# completion, filtering on workflow_run.head_branch — that field is
# documented to hold the tag name for a tag-associated run, but is
# unreliable in practice for tag pushes and silently produced a false `if:`
# (the whole run shows "Skipped"). Triggering on the tag push directly and
# actively polling the Actions API for CMake's run(s) against this exact
# commit is what actually works.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' doesn't look like vN.N.N — refusing to guess a version." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Wait for CMake CI to pass on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const timeoutMs = 30 * 60 * 1000;
            const pollMs = 15000;
            const start = Date.now();
            core.info(`Waiting for cmake.yml run(s) on ${sha}...`);
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'cmake.yml',
                head_sha: sha,
              });
              const runs = data.workflow_runs;
              if (runs.length > 0 && runs.every(r => r.status === 'completed')) {
                const failed = runs.filter(r => r.conclusion !== 'success');
                if (failed.length > 0) {
                  core.setFailed(
                    `CMake run(s) did not succeed for ${sha}: ` +
                    failed.map(r => `#${r.run_number} (${r.id}) = ${r.conclusion}`).join(', ')
                  );
                } else {
                  core.info(`All ${runs.length} CMake run(s) for ${sha} succeeded.`);
                }
                return;
              }
              if (Date.now() - start > timeoutMs) {
                core.setFailed(`Timed out waiting for CMake to complete on ${sha}.`);
                return;
              }
              core.info(runs.length === 0
                ? 'No CMake run found for this commit yet, still waiting...'
                : `${runs.filter(r => r.status !== 'completed').length} CMake run(s) still in progress...`);
              await new Promise(r => setTimeout(r, pollMs));
            }

      - name: Check tag matches conanfile.py / CMakeLists.txt version
        run: |
          version="${{ steps.version.outputs.version }}"
          conan_version=$(sed -n 's/^\s*version\s*=\s*"\(.*\)"/\1/p' conanfile.py | head -1)
          cmake_version=$(sed -n 's/^\s*VERSION\s\+\([0-9.]\+\)\s*$/\1/p' CMakeLists.txt | head -1)
          if [[ "$version" != "$conan_version" ]]; then
            echo "::error::Tag version ${version} != conanfile.py version ${conan_version}" >&2
            exit 1
          fi
          if [[ "$version" != "$cmake_version" ]]; then
            echo "::error::Tag version ${version} != CMakeLists.txt version ${cmake_version}" >&2
            exit 1
          fi

      - name: Build source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          staging="/tmp/spida-${version}"
          mkdir -p "${staging}"

          # CMakeLists.txt/cmake/include/src/external/nayukidct match
          # conanfile.py's exports_sources (the Conan-library-consumer
          # scope); worker/conanfile.py/conan.lock are additional, for the
          # "build spida-worker standalone, no git checkout" audience
          # conanfile.py's recipe was never meant to cover on its own — see
          # this file's header comment and conanfile.py's own
          # exports_sources comment for why that's intentional, not a
          # missed sync.
          cp -R CMakeLists.txt cmake include src worker conanfile.py conan.lock "${staging}/"
          mkdir -p "${staging}/external/nayukidct"
          cp -R external/nayukidct/CMakeLists.txt \
                external/nayukidct/cmake \
                external/nayukidct/include \
                external/nayukidct/src \
                "${staging}/external/nayukidct/"

          tarball="spida-${version}-src.tar.gz"
          tar -C /tmp -czf "${tarball}" "spida-${version}"
          sha256sum "${tarball}" | tee "${tarball}.sha256"

          {
            echo "### spida ${version} source tarball"
            echo
            echo '```'
            cat "${tarball}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: spida ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            spida-${{ steps.version.outputs.version }}-src.tar.gz
            spida-${{ steps.version.outputs.version }}-src.tar.gz.sha256
