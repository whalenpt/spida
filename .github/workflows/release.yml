name: Release

# Publishes a self-contained source tarball as a GitHub Release asset for
# every vN.N.N tag. This exists because GitHub's own auto-generated tag
# tarball is a plain `git archive` — it does NOT include submodule content,
# so it's missing external/nayukidct, which spida's build needs. This
# tarball is what conanfile.py's source() fallback downloads for a consumer
# with no local git checkout of spida (see conanfile.py and CLAUDE.md).
#
# Gated on the CMake workflow (build+test+package-test on Linux/Windows/
# macOS) actually passing for this same tag — triggered via workflow_run
# rather than push, since that's the only way to depend on another
# workflow's outcome across workflow files. This means a broken tag never
# publishes a release: no ordinary `on: push: tags` trigger here.
on:
  workflow_run:
    workflows: ["CMake"]
    types: [completed]

permissions:
  contents: write

jobs:
  source-tarball:
    runs-on: ubuntu-latest
    # workflow_run fires for every completion of the CMake workflow — pushes
    # to main/develop and PRs included, not just tag pushes — so filter down
    # to a successful run that was actually triggered by a vN.N.N tag.
    # head_branch carries the tag name (not a branch) when the triggering
    # push was a tag push.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Derive version from tag
        id: version
        run: |
          tag="${{ github.event.workflow_run.head_branch }}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' doesn't look like vN.N.N — refusing to guess a version." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches conanfile.py / CMakeLists.txt version
        run: |
          version="${{ steps.version.outputs.version }}"
          conan_version=$(sed -n 's/^\s*version\s*=\s*"\(.*\)"/\1/p' conanfile.py | head -1)
          cmake_version=$(sed -n 's/^\s*VERSION\s\+\([0-9.]\+\)\s*$/\1/p' CMakeLists.txt | head -1)
          if [[ "$version" != "$conan_version" ]]; then
            echo "::error::Tag version ${version} != conanfile.py version ${conan_version}" >&2
            exit 1
          fi
          if [[ "$version" != "$cmake_version" ]]; then
            echo "::error::Tag version ${version} != CMakeLists.txt version ${cmake_version}" >&2
            exit 1
          fi

      - name: Build source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          staging="/tmp/spida-${version}"
          mkdir -p "${staging}"

          # Exactly what conanfile.py's exports_sources bundles for a local
          # `conan create .` — keep these two lists in sync.
          cp -R CMakeLists.txt cmake include src "${staging}/"
          mkdir -p "${staging}/external/nayukidct"
          cp -R external/nayukidct/CMakeLists.txt \
                external/nayukidct/cmake \
                external/nayukidct/include \
                external/nayukidct/src \
                "${staging}/external/nayukidct/"

          tarball="spida-${version}-src.tar.gz"
          tar -C /tmp -czf "${tarball}" "spida-${version}"
          sha256sum "${tarball}" | tee "${tarball}.sha256"

          {
            echo "### spida ${version} source tarball"
            echo
            echo '```'
            cat "${tarball}.sha256"
            echo '```'
            echo
            echo "Pin this in conanfile.py's \`_RELEASE_SHA256\` dict so"
            echo "\`conan create\` from a bare recipe verifies it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # workflow_run means github.ref here is release.yml's own trigger
          # context (the default branch), not the tag that triggered CMake —
          # tag_name must be explicit or this attaches to the wrong ref.
          tag_name: ${{ steps.version.outputs.tag }}
          name: spida ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            spida-${{ steps.version.outputs.version }}-src.tar.gz
            spida-${{ steps.version.outputs.version }}-src.tar.gz.sha256
